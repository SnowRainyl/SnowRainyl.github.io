name: Auto Translate Posts

on:
  push:
    branches: [main]
    paths:
      - "content/zh/posts/**/*.md"
      - "content/en/posts/**/*.md"
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    # Skip commits that are themselves auto-translations or deletion syncs
    if: "github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, 'auto: translate') && !contains(github.event.head_commit.message, 'auto: sync deletions'))"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-genai

      - name: Translate new posts
        run: python scripts/translate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit translated posts
        run: |
          git config user.name "Translation Bot"
          git config user.email "noreply@github.com"
          git add -A content/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          elif git diff --staged --name-status | grep -q "^D"; then
            git commit -m "auto: sync deletions" && git push
          else
            git commit -m "auto: translate new posts" && git push
          fi
