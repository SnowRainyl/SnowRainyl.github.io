baseURL: "https://snowrainyl.netlify.app/"
title: "SnowRainyl's Blog"
theme: "PaperMod"

paginate: 10
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

# 中英双语配置
languages:
  zh:
    languageName: "中文"
    weight: 1
    title: "SnowRainyl 的博客"
    contentDir: content/zh
  en:
    languageName: "English"
    weight: 2
    title: "SnowRainyl's Blog"
    contentDir: content/en

params:
  author:
    name: "SnowRainyl"
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowToc: true
  
  profileMode:
    enabled: true
    title: "Hi, I'm SnowRainyl 👋"
    subtitle: "Welcome to my clean and simple blog."
    imageUrl: "https://github.com/SnowRainyl.png"
    imageWidth: 120
    imageHeight: 120