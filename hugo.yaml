baseURL: "https://snowrainyl.github.io/"
title: "SnowRainyl's Blog"
theme: "PaperMod"

paginate: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

# 中英双语配置
languages:
  zh:
    languageName: "中文"
    weight: 1
    title: "SnowRainyl 的博客"
    contentDir: content/zh
    menu:
      main:
        - name: 文章
          url: /posts/
          weight: 1
        - name: 分类
          url: /categories/
          weight: 2
        - name: 搜索
          url: /search/
          weight: 3
  en:
    languageName: "English"
    weight: 2
    title: "SnowRainyl's Blog"
    contentDir: content/en
    menu:
      main:
        - name: Posts
          url: /posts/
          weight: 1
        - name: Categories
          url: /en/categories/
          weight: 2
        - name: Search
          url: /search/
          weight: 3

params:
  author: "SnowRainyl"
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowToc: true
  
  comments: true

  socialIcons:
    - name: github
      url: "https://github.com/SnowRainyl"

  profileMode:
    enabled: true
    title: "Hi, I'm SnowRainyl 👋"
    subtitle: "Welcome to my clean and simple blog."
    imageUrl: "https://github.com/SnowRainyl.png"
    imageWidth: 120
    imageHeight: 120